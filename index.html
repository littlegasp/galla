<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Galla — हर राइड का पक्का हिसाब। ऑटो, बाइक और कैब कैप्टन के लिए कमाई का हिसाब।">
<title>Galla — हर राइड का पक्का हिसाब</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-96.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@600;700;800&family=Anek+Gujarati:wght@600;800&family=Hind:wght@400;500;600&family=Hind+Vadodara:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --y: #FFC629;          /* auto yellow */
    --ink: #121212;        /* road black */
    --cream: #F6F2E7;
    --card: #FFFFFF;
    --line: #E4DDCB;
    --line2: #CFC8B4;
    --muted: #5A5547;
    --soft: #EFE9DA;
    --good: #1C6B35;
    --bad: #B3261E;
    --rec: #E53935;        /* kavach recording red */
    --fd: 'Anek Devanagari', 'Anek Gujarati', sans-serif;
    --fb: 'Hind', 'Hind Vadodara', system-ui, sans-serif;
  }
  html[lang="gu"] { --fd: 'Anek Gujarati', 'Anek Devanagari', sans-serif; --fb: 'Hind Vadodara', 'Hind', system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); }
  body { font-family: var(--fb); font-size: 16px; line-height: 1.4; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
  .hidden { display: none !important; }
  .fd { font-family: var(--fd); }

  /* ---------- shared pieces ---------- */
  .band { background: var(--ink); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 42px; height: 42px; border-radius: 11px; display: block; }
  .brand .name { font-family: var(--fd); font-weight: 800; font-size: 26px; line-height: 1; color: var(--y); }
  .brand .sub { font-size: 13px; color: #D9D3C3; margin-top: 3px; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .langpill {
    appearance: none; -webkit-appearance: none; height: 40px; padding: 0 30px 0 14px; border-radius: 20px;
    border: 2px solid var(--y); background: transparent; color: var(--y); font-weight: 600; font-size: 15px;
    background-image: linear-gradient(45deg, transparent 50%, var(--y) 50%), linear-gradient(135deg, var(--y) 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .langpill option { color: #121212; }
  .road { height: 10px; margin: 16px -16px 0; background-image: repeating-linear-gradient(90deg, var(--y) 0 24px, var(--ink) 24px 48px); animation: road 1.2s linear infinite; }
  @keyframes road { from { background-position: 0 0 } to { background-position: -48px 0 } }
  .wrap { padding: 0 16px; }
  .h3 { font-family: var(--fd); font-weight: 700; font-size: 19px; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .h3 small { font-family: var(--fb); font-weight: 500; font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .chip {
    min-height: 48px; border-radius: 12px; border: 2px solid var(--line2); background: var(--card); color: var(--ink);
    font-weight: 600; font-size: 15px; padding: 6px 10px; line-height: 1.2;
  }
  .chip.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .chip.yon { border-color: var(--ink); background: var(--y); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; height: 60px; border-radius: 16px; border: 2px solid var(--ink);
    font-family: var(--fd); font-weight: 800; font-size: 22px; text-decoration: none; width: 100%;
  }
  .btn.y { background: var(--y); color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .btn.k { background: var(--ink); color: var(--y); }
  .btn.k2 { background: var(--ink); color: #fff; box-shadow: 0 4px 0 var(--muted); }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .bar { height: 12px; border-radius: 6px; background: var(--soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: #8A8370; transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .bar > i.top { background: var(--ink); }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .muted { color: var(--muted); }
  .center { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 16px; }
  .center img { width: 96px; height: 96px; border-radius: 24px; }

  /* ---------- setup ---------- */
  .hero { width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover; border-radius: 14px; display: block; margin-top: 12px; }
  .headline { font-family: var(--fd); font-weight: 800; font-size: 26px; line-height: 1.2; margin-top: 12px; }
  .headline span { color: var(--y); }
  .veh { border-radius: 16px; border: 2px solid var(--line2); background: var(--card); padding: 8px 6px; text-align: center; font-weight: 700; }
  .veh img { width: 100%; max-width: 96px; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; margin: 0 auto 4px; }
  .veh.sel { border: 3px solid var(--ink); background: var(--y); box-shadow: 0 4px 0 var(--ink); }
  .veh.sel img { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 8px; font-weight: 600; }
  .fine { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }

  /* ---------- home ---------- */
  .netrow { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .netlabel { font-size: 15px; color: #D9D3C3; }
  .net { font-family: var(--fd); font-weight: 800; font-size: 58px; line-height: 1.02; letter-spacing: -0.02em; }
  .net.neg { color: #FF8A80; }
  .pills { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pill-y { background: var(--y); color: var(--ink); border-radius: 10px; padding: 4px 10px; font-size: 15px; font-weight: 700; }
  .pill-o { border: 1.5px solid #5A5547; border-radius: 10px; padding: 3px 10px; font-size: 15px; }
  .galla { position: relative; width: 84px; height: 96px; flex: none; }
  .galla img { position: absolute; left: 0; bottom: 0; width: 84px; height: 84px; border-radius: 20px; }
  .coin {
    position: absolute; left: 29px; top: 18px; width: 26px; height: 26px; border-radius: 13px; background: var(--y);
    border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--y); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: var(--ink); z-index: 2; animation: drop 2.4s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes drop { 0% { transform: translateY(-46px) rotate(-20deg); opacity: 0 } 15% { opacity: 1 } 55% { transform: translateY(6px) rotate(0); opacity: 1 } 70% { transform: translateY(14px) scale(.6); opacity: 0 } 100% { opacity: 0 } }
  .tile { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
  .tile .k { font-size: 13px; color: var(--muted); }
  .tile .v { font-family: var(--fd); font-weight: 800; font-size: 24px; }
  .appbtn {
    text-align: left; min-height: 62px; border-radius: 14px; border: 2px solid var(--line2); background: var(--card);
    padding: 8px 12px; display: flex; align-items: center; gap: 10px;
  }
  .appbtn .dot { width: 12px; height: 12px; border-radius: 6px; background: var(--line2); flex: none; }
  .appbtn .nm { font-size: 17px; font-weight: 600; line-height: 1.2; display: block; }
  .appbtn .st { font-size: 13px; color: var(--muted); display: block; }
  .appbtn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .appbtn.on .dot { background: var(--y); animation: pulse 1.6s infinite; }
  .appbtn.on .st { color: var(--y); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,198,41,.8) } 70% { box-shadow: 0 0 0 10px rgba(255,198,41,0) } 100% { box-shadow: 0 0 0 0 rgba(255,198,41,0) } }
  .barrow { display: grid; grid-template-columns: 92px 1fr 56px; gap: 8px; align-items: center; font-size: 15px; }
  .barrow b { text-align: right; }
  .weeklink {
    margin-top: 12px; display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 14px;
    border-radius: 14px; background: var(--y); border: 2px solid var(--ink); font-weight: 700; font-size: 15px; width: 100%;
    position: relative; overflow: hidden;
  }
  .weeklink::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60px; background: rgba(255,255,255,.45); transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg) } 60%,100% { transform: translateX(800%) skewX(-20deg) } }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  .li-t { font-size: 13px; color: var(--muted); width: 44px; flex: none; }
  .li-m { flex: 1; min-width: 0; }
  .li-m b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-m span { font-size: 13px; color: var(--muted); }
  .li-a { font-weight: 700; }
  .li-a.plus { color: var(--good); }
  .li-a.minus { color: var(--bad); }
  .li-x { border: 0; background: transparent; color: var(--muted); font-size: 22px; width: 44px; height: 44px; border-radius: 10px; }
  .li-x:active { background: #FDECEA; color: var(--bad); }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 0; padding-bottom: 110px; }
  .foot button { background: none; border: 0; color: var(--ink); text-decoration: underline; font-weight: 600; padding: 6px; }
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--cream); border-top: 2px solid var(--line);
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .actions > div { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }

  /* ---------- week ---------- */
  .backbtn { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--y); background: transparent; display: flex; align-items: center; justify-content: center; flex: none; }
  .heat { display: grid; grid-template-columns: 40px repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: var(--muted); text-align: center; }
  .heat .d { text-align: left; align-self: center; }
  .heat .c { height: 28px; border-radius: 6px; background: var(--soft); animation: pop .4s ease-out both; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .heat .l0 { background: #F3EEE2; }
  .heat .l1 { background: #FFE9A6; color: var(--ink); }
  .heat .l2 { background: var(--y); color: var(--ink); }
  .heat .l3 { background: var(--ink); color: var(--y); }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
  .tip { margin-top: 12px; background: var(--y); border: 2px solid var(--ink); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; animation: glow 2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,198,41,0) } 50% { box-shadow: 0 0 0 6px rgba(255,198,41,.45) } }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(18,18,18,.6); z-index: 20; display: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: none; max-height: 96vh; overflow: auto;
    background: var(--cream); border-radius: 24px 24px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .scrim.open, .sheet.open { display: block; }
  .sheet.open { animation: up .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  .sheet-in { max-width: 448px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line2); align-self: center; }
  .shead { display: flex; justify-content: space-between; align-items: center; }
  .shead .t { display: flex; align-items: center; gap: 10px; font-family: var(--fd); font-weight: 800; font-size: 24px; }
  .shead img { width: 34px; height: 34px; border-radius: 9px; }
  .xbtn { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--ink); background: transparent; display: flex; align-items: center; justify-content: center; }
  .amount { border: 2px solid var(--ink); border-radius: 18px; padding: 8px 18px 10px; box-shadow: 0 4px 0 var(--ink); }
  .amount.y { background: var(--y); }
  .amount.w { background: var(--card); }
  .amount .lbl { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
  .amount .val { font-family: var(--fd); font-weight: 800; font-size: 54px; line-height: 1.05; display: flex; align-items: center; }
  .amount.w .val { color: var(--bad); }
  .caret { display: inline-block; width: 3px; height: 44px; background: var(--ink); margin-left: 4px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .kmrow { display: flex; align-items: center; justify-content: space-between; border: 2px dashed var(--muted); border-radius: 12px; padding: 6px 12px; font-weight: 600; background: transparent; width: 100%; text-align: left; }
  .kmrow.active { border: 2px solid var(--ink); background: var(--card); }
  .kmrow .kv { font-family: var(--fd); font-weight: 800; font-size: 22px; }
  .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .key { height: 54px; border-radius: 14px; border: 0; background: var(--card); font-family: var(--fd); font-weight: 700; font-size: 28px; color: var(--ink); }
  .key.alt { background: var(--soft); font-size: 22px; }
  .key:active { transform: translateY(2px); background: var(--soft); }
  .serr { color: var(--bad); font-size: 14px; font-weight: 600; min-height: 18px; text-align: center; }

  /* ---------- done overlay ---------- */
  .done { position: fixed; inset: 0; z-index: 40; background: rgba(18,18,18,.94); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .done.open { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .done .stage { position: relative; width: 160px; height: 200px; }
  .done .big-coin { position: absolute; left: 55px; top: 30px; width: 50px; height: 50px; border-radius: 25px; background: var(--y); border: 3px solid var(--ink); box-shadow: 0 0 0 3px var(--y); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 800; font-size: 26px; color: var(--ink); z-index: 2; animation: drop2 .9s cubic-bezier(.5,0,.5,1) forwards; }
  @keyframes drop2 { 0% { transform: translateY(-120px) rotate(-30deg) } 70% { transform: translateY(10px) rotate(0) } 85% { transform: translateY(0) } 100% { transform: translateY(24px) scale(.5); opacity: 0 } }
  .done .stage img { position: absolute; left: 10px; bottom: 0; width: 140px; height: 140px; border-radius: 32px; animation: shake .3s ease-in-out .8s 2; }
  @keyframes shake { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }
  .done .tick { width: 110px; height: 110px; border-radius: 55px; background: var(--y); display: flex; align-items: center; justify-content: center; }
  .done .tick path { stroke-dasharray: 40; animation: tick .5s ease-out .15s both; }
  @keyframes tick { from { stroke-dashoffset: 40 } to { stroke-dashoffset: 0 } }
  .done h2 { font-family: var(--fd); font-weight: 800; font-size: 32px; margin: 18px 0 0; color: var(--y); }
  .done p { margin: 6px 0 0; color: #D9D3C3; font-size: 16px; }
  .banner { margin: 10px 16px 0; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
  .banner.demo { background: #FFE9A6; color: var(--ink); }
  .banner.off { background: #3A3115; color: var(--y); }
  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--y); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* ---------- screenshot import ---------- */
  .how { font-size: 15px; }
  .how ol { margin: 6px 0 0; padding-left: 20px; }
  .how li { margin: 4px 0; }
  .linkbtn { background: none; border: 0; color: var(--ink); text-decoration: underline; font-weight: 600; padding: 8px; font-size: 15px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .thumbs img { width: 56px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid var(--ink); }
  .reading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0; text-align: center; }
  .scan { position: relative; width: 96px; height: 96px; }
  .scan img { width: 96px; height: 96px; border-radius: 22px; }
  .scan::after { content: ""; position: absolute; left: -6px; right: -6px; height: 4px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 3px var(--y); animation: scan 1.4s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 4px } to { top: 88px } }
  .check { border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: flex-start; }
  .check.ok { background: #E3F4E8; color: var(--good); }
  .check.warn { background: #FFF1D6; color: #7A4B00; }
  .rv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rv-head b { font-family: var(--fd); font-size: 20px; }
  .rv-tot { font-family: var(--fd); font-weight: 800; font-size: 28px; }
  .stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; margin-top: 8px; }
  .stepper button { height: 52px; border-radius: 14px; border: 2px solid var(--ink); background: var(--card); font-size: 26px; font-weight: 800; }
  .stepper div { text-align: center; font-family: var(--fd); font-weight: 800; font-size: 26px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; background: var(--soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .actions .imp { display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* ---------- kavach ---------- */
  .kvlink {
    margin-top: 12px; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; width: 100%; text-align: left;
    border-radius: 14px; background: var(--ink); color: #fff; border: 2px solid var(--ink);
  }
  .kvlink b { font-family: var(--fd); font-size: 18px; color: var(--y); display: block; line-height: 1.15; }
  .kvlink .s { font-size: 13px; color: #D9D3C3; display: block; }
  .kvlink.rec { background: #3A0F0C; border-color: var(--rec); }
  .kvlink.rec b { color: #fff; }
  .recdot { width: 12px; height: 12px; border-radius: 6px; background: var(--rec); flex: none; animation: recp 1.2s infinite; }
  @keyframes recp { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.85) } 70% { box-shadow: 0 0 0 10px rgba(229,57,53,0) } 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0) } }
  .kvhero { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 18px; }
  .kvbtn {
    width: 164px; height: 164px; border-radius: 82px; border: 4px solid var(--y); background: var(--ink); color: var(--y); flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px;
    font-family: var(--fd); font-weight: 800; font-size: 19px; line-height: 1.15; box-shadow: 0 0 0 8px rgba(255,198,41,.16);
  }
  .kvbtn.rec { border-color: var(--rec); background: #3A0F0C; color: #fff; animation: recring 1.6s infinite; }
  @keyframes recring { 0% { box-shadow: 0 0 0 0 rgba(229,57,53,.7) } 70% { box-shadow: 0 0 0 20px rgba(229,57,53,0) } 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0) } }
  .kvtime { font-family: var(--fd); font-weight: 800; font-size: 26px; letter-spacing: .03em; }
  .kvcam { width: 108px; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; border: 2px solid var(--rec); background: #000; flex: none; position: relative; }
  .kvcam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .kvcam.check { border-color: var(--y); }
  .kvcam.check span { background: var(--y); color: var(--ink); }
  .kvcam span { position: absolute; left: 6px; top: 6px; z-index: 2; background: var(--rec); color: #fff; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; }
  .kvstate { text-align: center; color: #D9D3C3; font-size: 14px; margin-top: 10px; }
  .kvrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kvrow:first-child { border-top: 0; }
  .kvrow .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--soft); display: flex; align-items: center; justify-content: center; flex: none; }
  .kvrow .tx { flex: 1; min-width: 0; }
  .kvrow .tx b { display: block; }
  .kvrow .tx span { font-size: 13px; color: var(--muted); }
  .btn.sos { background: var(--rec); color: #fff; box-shadow: 0 4px 0 var(--ink); }
  .lock { border-left: 6px solid var(--y); }
  .field { width: 100%; border: 2px solid var(--line2); border-radius: 12px; padding: 10px 12px; background: var(--card); font-size: 17px; }
  .field:focus { outline: none; border-color: var(--ink); }
  textarea.field { min-height: 76px; resize: vertical; }
  .cbx { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: 15px; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 12px; cursor: pointer; }
  .cbx input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--ink); }
  .sos-big { display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 16px; font-family: var(--fd); font-weight: 800; font-size: 22px; text-decoration: none; border: 2px solid var(--ink); }

  /* ---------- goal, week nav, settings ---------- */
  .goal { margin-top: 10px; max-width: 240px; }
  .goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #D9D3C3; }
  .goal-top b { color: var(--y); }
  .goalbar { height: 10px; border-radius: 5px; background: #3A3527; overflow: hidden; margin-top: 4px; }
  .goalbar i { display: block; height: 100%; width: 0; background: var(--y); border-radius: 5px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .goal.done .goalbar i { background: #7CD992; }
  .goal.done .goal-top b { color: #7CD992; }
  .weeknav { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin-top: 14px; }
  .navbtn { width: 48px; height: 48px; border-radius: 24px; border: 2px solid var(--ink); background: var(--y); display: flex; align-items: center; justify-content: center; }
  .navbtn:disabled { background: #3A3527; border-color: #3A3527; opacity: .5; }
  .weekrange { text-align: center; font-family: var(--fd); font-weight: 700; font-size: 18px; color: #fff; }
  .pill-g { border-radius: 10px; padding: 3px 10px; font-size: 14px; font-weight: 700; background: #1F3A27; color: #7CD992; }
  .pill-r { border-radius: 10px; padding: 3px 10px; font-size: 14px; font-weight: 700; background: #3A1A17; color: #FF8A80; }
  .dayrow { display: grid; grid-template-columns: 104px 1fr 80px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .dayrow:first-child { border-top: 0; }
  .dayrow .dn b { display: block; }
  .dayrow .dn span, .dayrow .dm { font-size: 12px; color: var(--muted); }
  .dayrow .dv { text-align: right; font-weight: 700; }
  .dayrow .dv span { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .dayrow.today .dn b::after { content: " •"; color: var(--rec); }
  .dayrow.goalmet .dv b { color: var(--good); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>

  kvIntroT:   { hi: "कवच कैसे काम करता है", mr: "कवच कसे काम करते", gu: "કવચ કેવી રીતે કામ કરે છે", en: "How Kavach works" },
  kvIntro1:   { hi: "एक टैप — आवाज़ और सामने के कैमरे का वीडियो रिकॉर्ड, समय और लोकेशन के साथ।", mr: "एक टॅप — आवाज आणि समोरच्या कॅमेऱ्याचा व्हिडिओ रेकॉर्ड, वेळ आणि लोकेशनसह.", gu: "એક ટેપ — અવાજ અને આગળના કૅમેરાનો વીડિયો રેકોર્ડ, સમય અને લોકેશન સાથે.", en: "One tap records audio and front-camera video, with time and location." },
  kvIntro2:   { hi: "आवाज़ हर मिनट लॉक होकर Galla सर्वर पर जाती है। वीडियो फ़ोन में लॉक रहता है और सिर्फ़ रिपोर्ट करने पर जाता है — आपका डेटा बचता है।", mr: "आवाज दर मिनिटाला लॉक होऊन Galla सर्व्हरवर जातो. व्हिडिओ फोनमध्ये लॉक राहतो आणि फक्त रिपोर्ट केल्यावर जातो — तुमचा डेटा वाचतो.", gu: "અવાજ દર મિનિટે લૉક થઈને Galla સર્વર પર જાય છે. વીડિયો ફોનમાં લૉક રહે છે અને ફક્ત રિપોર્ટ કરો ત્યારે જાય છે — તમારો ડેટા બચે છે.", en: "Audio is locked and sent to Galla's server every minute. Video stays locked on the phone and goes only when you report — saving your data." },
  kvIntro3:   { hi: "कोई भी रिकॉर्डिंग देख नहीं सकता — आप भी नहीं। रिपोर्ट करने पर ही जाँच के बाद पुलिस या वकील को मिलती है।", mr: "कोणीही रेकॉर्डिंग पाहू शकत नाही — तुम्हीही नाही. रिपोर्ट केल्यावरच तपासणीनंतर पोलीस किंवा वकिलांना मिळते.", gu: "કોઈ રેકોર્ડિંગ જોઈ શકતું નથી — તમે પણ નહીં. રિપોર્ટ કરો ત્યારે જ તપાસ પછી પોલીસ અથવા વકીલને મળે છે.", en: "Nobody can watch the recordings — not even you. Only after a report, and a review, do they go to the police or a lawyer." },
  kvIntro4:   { hi: "7 दिन बाद सब अपने-आप डिलीट, सिवाय रिपोर्ट वाली रिकॉर्डिंग के।", mr: "7 दिवसांनी सर्व आपोआप डिलीट, रिपोर्ट केलेले सोडून.", gu: "7 દિવસ પછી બધું આપમેળે ડિલીટ, રિપોર્ટ કરેલું સિવાય.", en: "Everything deletes itself after 7 days, except recordings tied to a report." },
  kvSticker:  { hi: "मैंने गाड़ी पर \"यह राइड सुरक्षा के लिए रिकॉर्ड होती है\" वाला Galla स्टिकर लगाया है, जो सवारी को दिखता है।", mr: "मी गाडीवर \"ही राईड सुरक्षेसाठी रेकॉर्ड होते\" असा Galla स्टिकर लावला आहे, जो प्रवाशाला दिसतो.", gu: "મેં વાહન પર \"આ રાઇડ સુરક્ષા માટે રેકોર્ડ થાય છે\" વાળું Galla સ્ટીકર લગાવ્યું છે, જે સવારીને દેખાય છે.", en: "I have put the Galla sticker \"This ride is recorded for safety\" where the rider can see it." },

  kvNeedSticker:{ hi: "पहले स्टिकर वाला बॉक्स टिक करें", mr: "आधी स्टिकरचा बॉक्स टिक करा", gu: "પહેલાં સ્ટીકર વાળું બૉક્સ ટિક કરો", en: "Tick the sticker box first" },
  kvPerm:     { hi: "कैमरा और माइक की अनुमति दें — Chrome में ऊपर 🔒 → Permissions", mr: "कॅमेरा आणि माइकची परवानगी द्या — Chrome मध्ये वर 🔒 → Permissions", gu: "કૅમેરા અને માઇકની પરવાનગી આપો — Chrome માં ઉપર 🔒 → Permissions", en: "Allow camera and microphone — in Chrome tap 🔒 at the top → Permissions" },

  kvEmbedded: { hi: "इस प्रीव्यू में कैमरा बंद रहता है। रिकॉर्डिंग Galla की अपनी लिंक (Chrome) में चलेगी।", mr: "या प्रीव्ह्यूमध्ये कॅमेरा बंद असतो. रेकॉर्डिंग Galla च्या स्वतःच्या लिंकवर (Chrome) चालेल.", gu: "આ પ્રીવ્યૂમાં કૅમેરા બંધ રહે છે. રેકોર્ડિંગ Galla ની પોતાની લિંક (Chrome) માં ચાલશે.", en: "Camera is blocked inside this preview. Recording works from Galla's own link in Chrome." },
  kvNoSupport:{ hi: "यह ब्राउज़र रिकॉर्डिंग नहीं कर सकता। Galla को Chrome में खोलें।", mr: "हा ब्राउझर रेकॉर्डिंग करू शकत नाही. Galla Chrome मध्ये उघडा.", gu: "આ બ્રાઉઝર રેકોર્ડિંગ કરી શકતું નથી. Galla ને Chrome માં ખોલો.", en: "This browser can't record. Open Galla in Chrome." },
  kvNotSetup: { hi: "कवच अभी चालू नहीं किया गया है। Galla टीम से संपर्क करें।", mr: "कवच अजून सुरू केलेले नाही. Galla टीमशी संपर्क करा.", gu: "કવચ હજુ ચાલુ કરાયું નથી. Galla ટીમનો સંપર્ક કરો.", en: "Kavach isn't switched on for your link yet. Contact the Galla team." },

class LocalStore {
  constructor(cid) { this.key = "gl_demo_" + cid; this.data = LS.get(this.key, { cap: { online: {}, profile: null }, entries: [] }); }
  async init() { return "ok"; }
  save() { LS.set(this.key, this.data); this.emit(); }
  emit() { if (this.cb) { const ws = liveFrom(); this.cb({ cap: this.data.cap, entries: this.data.entries.filter(e => e.ts >= ws) }); } }
  async loadRange(from, to) { return this.data.entries.filter(e => e.ts >= from && e.ts < to); }
  subscribe(cb) { this.cb = cb; this.emit(); }
  async addEntry(e) { this.data.entries.push({ ...e, id: uid() }); this.save(); }
  async removeEntry(id) { this.data.entries = this.data.entries.filter(e => e.id !== id); this.save(); }
  async setOnline(app, start) { if (start) this.data.cap.online[app] = start; else delete this.data.cap.online[app]; this.save(); }
  async setProfile(p) { this.data.cap.profile = p; this.save(); }
  /** Demo: returns the trips from a real Rapido "All Orders → Day" screen (8 Oct 2026), moved to a recent date. */
  async readShot() {

const SHOT_PROMPT = `You read screenshots from Indian ride-hailing captain apps (Rapido, Uber, Ola, Namma Yatri, inDrive) showing the captain's OWN order history or earnings list.
Return JSON only, following the schema.
- app: one of rapido, uber, ola, namma, indrive, other (identify from the screen's wording and style).
- summaryOrders / summaryEarnings: only if a summary box with completed-order count and total earnings is visible; earnings as a plain number (395.04).
- missedCount: only if a count of missed orders is clearly shown.
- trips: every order card whose time AND amount are both fully visible. Skip cards cut off at the top or bottom edge.
  - date: YYYY-MM-DD from the nearest date heading above the card (e.g. "08 October, 2026" -> 2026-10-08).
  - time: 24-hour HH:MM (8:39 pm -> 20:39).
  - amount: the captain's earning for that order as a number, no currency sign.
  - vehicle: as shown (Bike, Auto, Cab) if visible.
  - pickupArea: ONLY the locality / neighbourhood of the pickup (first, green-dot) address, like "Powai", "Ghatkopar West", "Andheri East". Never a building, society, flat, shop, landmark or house number. Leave empty if unsure.
  - status: completed, cancelled or missed (from the selected tab; default completed).
Never output a drop address, a customer name, a phone number or any other personal detail.`;

class FireStore {
  constructor(cid) { this.cid = cid; this.cap = null; this.entries = []; }
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    this.F = F;
    const app = initializeApp(FIREBASE_CONFIG);
    this.app = app;
    if (RECAPTCHA_SITE_KEY) {
      try {
        const AC = await import(base + "firebase-app-check.js");
        AC.initializeAppCheck(app, { provider: new AC.ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
      } catch (e) { console.warn("App Check not started", e); }
    }
    this.db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    const auth = A.getAuth(app);
    let u = auth.currentUser || await new Promise(res => { const off = A.onAuthStateChanged(auth, x => { off(); res(x); }); });
    if (!u) { if (!navigator.onLine) return "needNet"; u = (await A.signInAnonymously(auth)).user; }
    this.uid = u.uid; this.auth = auth;
    this.capRef = F.doc(this.db, "captains", this.cid);
    this.entriesCol = F.collection(this.db, "captains", this.cid, "entries");
    try { const snap = await F.getDoc(this.capRef); if (snap.exists()) return "ok"; } catch (e) { /* not ours, or not created */ }
    try { await F.setDoc(this.capRef, { uid: this.uid, online: {}, profile: null, createdAt: F.serverTimestamp() }); return "ok"; }
    catch (e) { return navigator.onLine ? "claimed" : "needNet"; }
  }
  subscribe(cb) {
    const F = this.F, push = () => { if (this.cap) cb({ cap: this.cap, entries: this.entries }); };
    F.onSnapshot(this.capRef, s => { this.cap = s.data() || { online: {}, profile: null }; push(); });
    const q = F.query(this.entriesCol, F.where("ts", ">=", liveFrom()), F.orderBy("ts", "desc"));
    F.onSnapshot(q, s => { this.entries = s.docs.map(d => ({ id: d.id, ...d.data() })); push(); });
  }
  /** Reads one screenshot with Gemini via Firebase AI Logic. Returns the parsed JSON. */
  async readShot(b64) {
    if (!this.model) {
      const M = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-ai.js`), S = M.Schema;
      const schema = S.object({
        properties: {
          app: S.string(),
          summaryOrders: S.number(), summaryEarnings: S.number(), missedCount: S.number(),
          trips: S.array({ items: S.object({
            properties: { date: S.string(), time: S.string(), amount: S.number(), vehicle: S.string(), pickupArea: S.string(), status: S.string() },
            optionalProperties: ["vehicle", "pickupArea", "status"]
          }) })
        },
        optionalProperties: ["summaryOrders", "summaryEarnings", "missedCount"]
      });
      const ai = M.getAI(this.app, { backend: new M.GoogleAIBackend() });
      this.model = M.getGenerativeModel(ai, { model: AI_MODEL, generationConfig: { responseMimeType: "application/json", responseSchema: schema, temperature: 0 } });
    }
    const res = await this.model.generateContent([SHOT_PROMPT, { inlineData: { data: b64, mimeType: "image/jpeg" } }]);
    return JSON.parse(res.response.text());
  }
  /** One-off read of an older week (Firestore falls back to its offline cache without internet). */
  async loadRange(from, to) {
    const F = this.F, q = F.query(this.entriesCol, F.where("ts", ">=", from), F.where("ts", "<", to), F.orderBy("ts", "desc"));
    return (await F.getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
  }
  /** For the Android app's recorder: lets it upload as this same signed-in captain. */
  authInfo() {
    const u = this.auth && this.auth.currentUser;
    return { apiKey: FIREBASE_CONFIG.apiKey, projectId: FIREBASE_CONFIG.projectId, bucket: FIREBASE_CONFIG.storageBucket, refreshToken: u ? u.refreshToken : null };
  }
  // Writes land in the local cache at once and sync when online.
  async addEntry(e) { this.F.setDoc(this.F.doc(this.entriesCol), { ...e, createdAt: this.F.serverTimestamp() }).catch(console.error); }
  async removeEntry(id) { this.F.deleteDoc(this.F.doc(this.entriesCol, id)).catch(console.error); }
  async setOnline(app, start) { this.F.updateDoc(this.capRef, { ["online." + app]: start ? start : this.F.deleteField() }).catch(console.error); }
  async setProfile(p) { this.F.updateDoc(this.capRef, { profile: p }).catch(console.error); }

  /* Kavach. Hash registry: one small doc per recorded minute, written at capture time (even for video that never leaves the phone),
     auto-deleted by a Firestore TTL policy on expireAt. Recordings themselves go to Cloud Storage, encrypted, create-only. */
  async kvRegister(m) {
    const F = this.F;
    F.setDoc(F.doc(this.db, "captains", this.cid, "kavach", m.id), { ...m, expireAt: F.Timestamp.fromMillis(m.start + 8 * DAY), createdAt: F.serverTimestamp() }).catch(console.error);
  }
  async kvUpload(id, blob) {
    if (!this.S) {
      this.S = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-storage.js`);
      this.storage = this.S.getStorage(this.app);
    }
    await this.S.uploadBytes(this.S.ref(this.storage, `kavach/${this.cid}/${id}.gkv`), blob, { contentType: "application/octet-stream" });
  }
  async addReport(r) { const F = this.F, ref = F.doc(F.collection(this.db, "captains", this.cid, "reports")); F.setDoc(ref, { ...r, createdAt: F.serverTimestamp() }).catch(console.error); return ref.id; }
  watchReports(cb) {
    const F = this.F, q = F.query(F.collection(this.db, "captains", this.cid, "reports"), F.orderBy("ts", "desc"), F.limit(10));
    F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), console.error);
  }
}

/* =========================================================
   5. METRICS
   ========================================================= */
function unionMs(iv) {
  const s = iv.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]);
  let total = 0, cs = null, ce = null;
  for (const [a, b] of s) {
    if (cs === null) { cs = a; ce = b; } else if (a <= ce) { ce = Math.max(ce, b); } else { total += ce - cs; cs = a; ce = b; }
  }
  return cs === null ? total : total + ce - cs;
}
/** Online intervals per app (sessions + currently-open), unclipped. */
function intervals(cap, entries) {
  const now = Date.now(), out = [];
  entries.filter(e => e.type === "session").forEach(e => out.push({ app: e.app, a: e.start, b: e.end }));
  Object.entries(cap.online || {}).forEach(([app, st]) => out.push({ app, a: st, b: now }));
  return out;
}
const clipMs = (iv, from, to) => Math.max(0, Math.min(iv.b, to) - Math.max(iv.a, from));

function summarize(cap, entries, from, to = Date.now()) {
  const ivs = intervals(cap, entries);
  const trips = entries.filter(e => e.type === "trip" && e.ts >= from && e.ts <= to);
  const exps = entries.filter(e => e.type === "expense" && e.ts >= from && e.ts <= to);
  const perApp = {};
  const P = k => (perApp[k] ||= { trips: 0, fares: 0, ms: 0 });
  ivs.forEach(iv => { const m = clipMs(iv, from, to); if (m > 0) P(iv.app).ms += m; });
  trips.forEach(e => { P(e.app).trips++; P(e.app).fares += e.fare; });
  const onlineMs = unionMs(ivs.map(iv => [Math.max(iv.a, from), Math.min(iv.b, to)]));
  const fares = trips.reduce((s, e) => s + e.fare, 0);
  const expenses = exps.reduce((s, e) => s + e.amount, 0);
  const net = fares - expenses;
  return { fares, expenses, net, trips: trips.length, onlineMs, perHour: onlineMs >= 5 * 60000 ? net / (onlineMs / 3600e3) : null, perApp };
}

function heatmap(cap, entries, d0) {
  const ivs = intervals(cap, entries), rows = [];
  const slotTot = SLOTS.map(() => ({ f: 0, ms: 0 }));
  for (let d = 0; d < 7; d++) {
    const day = d0 + d * DAY, cells = [];
    SLOTS.forEach(([h1, h2], si) => {
      const a = day + h1 * 3600e3, b = day + h2 * 3600e3;
      const ms = unionMs(ivs.map(iv => [Math.max(iv.a, a), Math.min(iv.b, b)]));
      const f = entries.filter(e => e.type === "trip" && e.ts >= a && e.ts < b).reduce((s, e) => s + e.fare, 0);
      slotTot[si].f += f; slotTot[si].ms += ms;
      cells.push(ms >= 15 * 60000 ? f / (ms / 3600e3) : null);
    });
    rows.push({ day, cells });
  }
  const vals = rows.flatMap(r => r.cells).filter(v => v !== null);
  const max = vals.length ? Math.max(...vals) : 0;
  rows.forEach(r => { r.levels = r.cells.map(v => v === null ? 0 : !max ? 1 : v >= 0.75 * max ? 3 : v >= 0.45 * max ? 2 : 1); });
  let best = null;
  slotTot.forEach((s, i) => { if (s.ms >= 3600e3) { const v = s.f / (s.ms / 3600e3); if (!best || v > best.v) best = { i, v }; } });
  return { rows, best };
}

/* ---------- count-up net ---------- */
function setNet(target) {
  cancelAnimationFrame(netAnim);
  const from = shownNet, t0 = performance.now(), D = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), v = from + (target - from) * (1 - Math.pow(1 - p, 3));
    shownNet = v; $("vNet").textContent = rupees(v); $("vNet").classList.toggle("neg", v < 0);
    if (p < 1) netAnim = requestAnimationFrame(step);
  };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { shownNet = target; $("vNet").textContent = rupees(target); return; }
  netAnim = requestAnimationFrame(step);
}

/* ---------- week ---------- */
let weekOff = 0, weekCache = {}, weekView = null;
const fmtDay = ts => new Date(ts).toLocaleDateString(locale(), { day: "numeric", month: "short" });
const goal = () => Number((state.cap.profile || {}).goal) || 0;
/** Entries for a week: live data for this and last week, a one-off load (cached) for older weeks. */
function weekEntries(off) {
  const from = weekFrom(off);
  if (from >= liveFrom()) return Promise.resolve(state.entries);
  if (!weekCache[off]) weekCache[off] = store.loadRange(from, from + 7 * DAY).catch(e => { delete weekCache[off]; throw e; });
  return weekCache[off];
}

async function renderWeek() {
  const off = weekOff, from = weekFrom(off), end = from + 7 * DAY, now = Date.now(), to = Math.min(end, now);
  $("weekTitle").textContent = off === 0 ? t("thisWeek") : off === -1 ? t("weekLast") : fill(t("weekOld"), { n: -off });
  $("weekRange").textContent = `${fmtDay(from)} – ${fmtDay(end - DAY)}`;
  $("weekNext").disabled = off >= 0;
  let entries, prev;
  if (from < liveFrom()) { $("wSub").textContent = t("loading"); $("wCompare").innerHTML = ""; }
  try { [entries, prev] = await Promise.all([weekEntries(off), weekEntries(off - 1)]); }
  catch (e) { console.error(e); toast(t("readFail")); return; }
  if (off !== weekOff || current !== "scrWeek") return;          // the captain already moved on
  const cap = off === 0 ? state.cap : { online: {} };              // open sessions only count this week
  const m = summarize(cap, entries, from, to);
  $("wNet").textContent = rupees(m.net);
  $("wSub").innerHTML = "";
  const b = el("b", "", m.perHour === null ? `₹— ${t("perHr")}` : `${rupees(m.perHour)} ${t("perHr")}`);
  $("wSub").append(b, document.createTextNode(` ${t("avg")} · ${(m.onlineMs / 3600e3).toFixed(1)} ${t("hoursOnline")} · ${m.trips} ${t("trips")}`));

  // Versus last week — for this week, only up to the same day and hour, so it's a fair race.
  const cmp = $("wCompare"); cmp.innerHTML = "";
  const pm = summarize({ online: {} }, prev, from - 7 * DAY, to - 7 * DAY);
  if (pm.trips || pm.expenses) {
    const d = Math.round(m.net - pm.net);
    cmp.appendChild(el("div", d >= 0 ? "pill-g" : "pill-r", fill(t("vsLast"), { d: (d >= 0 ? "+" : "−") + "₹" + inr(Math.abs(d)) })));
  }

  // Day by day
  const days = [], dbox = $("weekDays"); dbox.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d0 = from + i * DAY; if (d0 > now) break;
    days.push({ d0, s: summarize(cap, entries, d0, Math.min(d0 + DAY - 1, now)) });
  }
  const G = goal(), worked = days.filter(x => x.s.trips || x.s.onlineMs >= 15 * 60000);
  const maxNet = Math.max(1, ...days.map(x => x.s.net));
  const best = worked.length ? worked.reduce((a, x) => x.s.net > a.s.net ? x : a) : null;
  $("byDayHint").textContent = G && worked.length ? fill(t("goalDays"), { n: worked.filter(x => x.s.net >= G).length, m: worked.length })
    : best ? fill(t("bestDay"), { d: new Date(best.d0).toLocaleDateString(locale(), { weekday: "short" }) }) : "";
  [...days].reverse().forEach(({ d0, s: x }, i) => {
    const row = el("div", "dayrow" + (d0 === dayStart() ? " today" : "") + (G && x.net >= G ? " goalmet" : "")), dn = el("div", "dn");
    dn.append(el("b", "", new Date(d0).toLocaleDateString(locale(), { weekday: "short", day: "numeric" })),
      el("span", "", x.trips || x.onlineMs ? `${x.trips} ${t("trips")} · ${x.onlineMs >= 3600e3 ? (x.onlineMs / 3600e3).toFixed(1) + t("hShort") : dur(x.onlineMs)}` : t("dayOff")));
    const bar = el("div", "bar"), f = el("i", best && d0 === best.d0 ? "top" : "");
    f.style.width = (x.net > 0 ? Math.max(4, x.net / maxNet * 100) : 0) + "%"; f.style.animationDelay = (i * 0.06) + "s"; bar.appendChild(f);
    const dv = el("div", "dv"); dv.append(el("b", "", x.trips || x.expenses ? rupees(x.net) : "—"), el("span", "", x.perHour === null ? "" : `${rupees(x.perHour)} ${t("perHr")}`));
    row.append(dn, bar, dv); dbox.appendChild(row);
  });

  const H = heatmap(cap, entries, from), grid = $("heat");
  grid.innerHTML = "";
  grid.appendChild(el("div"));
  SLOTS.forEach(([a, b]) => grid.appendChild(el("div", "", `${a > 12 ? a - 12 : a}–${b > 12 ? b - 12 : b}`)));
  H.rows.forEach((r, ri) => {
    grid.appendChild(el("div", "d", new Date(r.day).toLocaleDateString(locale(), { weekday: "short" })));
    r.cells.forEach((v, ci) => {
      const c = el("div", "c l" + r.levels[ci], v === null ? "" : inr(v));
      c.style.animationDelay = (ri * 0.04 + ci * 0.02) + "s";
      c.title = v === null ? "" : `₹${inr(v)}${t("perHr")}`;
      grid.appendChild(c);
    });
  });

  // Tip
  const apps = Object.entries(m.perApp).map(([k, p]) => ({ k, v: p.ms >= 3600e3 ? p.fares / (p.ms / 3600e3) : null })).filter(x => x.v !== null).sort((a, b) => b.v - a.v);
  if (H.best) {
    const [a, b] = SLOTS[H.best.i];
    let s = fill(t("bestTip"), { slot: `${t("slot" + H.best.i)} ${a > 12 ? a - 12 : a}–${b > 12 ? b - 12 : b}`, v: inr(H.best.v) });
    if (apps.length) s += fill(t("bestApp"), { app: appName(apps[0].k) });
    $("tipText").textContent = s;
  } else $("tipText").textContent = t("noTip");

  weekView = { from, end, m, best };

  // By app
  const wa = $("weekApps"); wa.innerHTML = "";
  const rows = Object.entries(m.perApp).map(([k, p]) => ({ k, p, v: p.ms >= 15 * 60000 ? p.fares / (p.ms / 3600e3) : null }))
    .filter(r => r.p.trips || r.p.ms).sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
  if (!rows.length) { wa.appendChild(el("div", "muted", t("noneApps"))); return; }
  const max = Math.max(...rows.map(r => r.v || 0)) || 1, wrap = el("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:10px";
  rows.forEach((r, i) => {
    const row = el("div", "barrow"), bar = el("div", "bar"), f = el("i", i === 0 && r.v ? "top" : "");
    f.style.width = (r.v ? Math.max(4, (r.v / max) * 100) : 0) + "%"; f.style.animationDelay = (i * 0.12) + "s";
    bar.appendChild(f);
    const nm = el("span"); nm.append(el("b", "", appName(r.k)), el("div", "muted", `${r.p.trips} ${t("trips")} · ${dur(r.p.ms)}`)); nm.lastChild.style.fontSize = "12px";
    row.append(nm, bar, el("b", "", r.v === null ? "—" : rupees(r.v)));
    wrap.appendChild(row);
  });
  wa.appendChild(wrap);
}

function buildKeys(box, onKey, decimal) {
  box.innerHTML = "";
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", decimal ? "." : "00", "0", "⌫"].forEach(k => {
    const b = el("button", "key" + (k === "00" || k === "." || k === "⌫" ? " alt" : ""), k);
    b.type = "button"; if (k === "⌫") b.setAttribute("aria-label", "Delete");
    b.onclick = () => onKey(k); box.appendChild(b);
  });
}
function typeInto(val, k, maxLen, allowDot) {
  if (k === "⌫") return val.slice(0, -1);
  if (k === ".") return !allowDot || val.includes(".") ? val : (val || "0") + ".";
  if (allowDot && val.includes(".") && val.split(".")[1].length >= 1) return val;
  const next = (val === "0" ? "" : val) + k;
  return next.replace(".", "").length > maxLen ? val : next;
}

function fileToJpeg(file, maxW = 720) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxW / img.width), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = rej; img.src = url;
  });
}
const tsOf = (date, time) => new Date(`${date}T${time}:00`).getTime();
const keyOf = tr => `${tr.date}|${tr.time}|${Number(tr.amount).toFixed(2)}`;
const money2 = n => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });

/** Groups trip times into shifts: a gap over 60 min starts a new shift; 15 min before the first trip, 10 after the last. */
function shiftsFrom(times) {
  const ts = [...times].sort((a, b) => a - b), out = [];
  ts.forEach(x => {
    const last = out[out.length - 1];
    if (last && x - last.lastTrip <= 60 * 60000) last.lastTrip = x; else out.push({ firstTrip: x, lastTrip: x });
  });
  return out.map(s => ({ start: s.firstTrip - 15 * 60000, end: s.lastTrip + 10 * 60000 }));
}

function planShifts() {
  const kept = imp.trips.filter(x => x.keep), app = imp.app || "other";
  const days = [...new Set(kept.map(x => x.date))];
  imp.haveSessions = days.length > 0 && days.every(d => state.entries.some(e => e.type === "session" && !e.est && e.app === app && e.end > tsOf(d, "00:00") && e.start < tsOf(d, "00:00") + DAY));
  imp.shifts = shiftsFrom(kept.map(x => tsOf(x.date, x.time)));
  const est = imp.shifts.reduce((s, x) => s + (x.end - x.start), 0) / 3600e3;
  imp.hours = Math.max(0.5, Math.round(est * 2) / 2);
}

async function readFiles(files) {
  if (!files.length) return;
  impStep("impReading");
  $("readTxt").textContent = fill(t("reading"), { n: files.length });
  const thumbs = $("impThumbs"); thumbs.innerHTML = "";
  const jpgs = [];
  for (const f of files) { try { const d = await fileToJpeg(f); jpgs.push(d); const i = el("img"); i.src = d; i.alt = ""; thumbs.appendChild(i); } catch {} }
  let results;
  try { results = await Promise.all(jpgs.map(d => store.readShot(d.split(",")[1]))); }
  catch (e) { console.error(e); impStep(imp.trips.length ? "impReview" : "impPick"); toast(t("readFail")); return; }
  const seen = new Set(imp.trips.map(keyOf));
  results.forEach(r => {
    if (!r) return;
    if (r.demo) imp.demo = true;
    if (r.app && !imp.app) imp.app = APPS.some(a => a.k === r.app) ? r.app : "other";
    if (r.summaryEarnings) imp.summary = { orders: r.summaryOrders || null, earnings: r.summaryEarnings };
    if (typeof r.missedCount === "number" && r.missedCount > 0) imp.missed = r.missedCount;
    (r.trips || []).forEach(tr => {
      if (!tr || !/^\d{4}-\d{2}-\d{2}$/.test(tr.date || "") || !/^\d{1,2}:\d{2}$/.test(tr.time || "") || !(tr.amount > 0)) return;
      if (tr.status && tr.status !== "completed") return;
      tr.time = tr.time.padStart(5, "0");
      const k = keyOf(tr); if (seen.has(k)) return; seen.add(k);
      imp.trips.push({ ...tr, keep: true });
    });
  });
  imp.trips.sort((a, b) => tsOf(b.date, b.time) - tsOf(a.date, a.time));
  if (!imp.trips.length) { impStep("impPick"); toast(t("noTrips")); return; }
  planShifts();
  renderReview(); impStep("impReview");
}

/* =========================================================
   7. KAVACH — ride safety recorder
   Every minute closes a standalone audio file (and, with the camera on, a video file).
   Each file is hashed (SHA-256) and then sealed: AES-256-GCM with a fresh key, and that key
   wrapped with Galla's RSA public key. The phone cannot open its own recordings.
   Audio → uploaded straight away. Video → kept on the phone for 2 hours, uploaded only for a report.
   ========================================================= */
const KV = { SEG_MS: 60000, VIDEO_KEEP_MS: 2 * 3600e3, PAD_MS: 10 * 60000, MAX_AGE_MS: 7 * DAY, AUDIO_BPS: 24000, VIDEO_BPS: 300000, SOS_MS: 30 * 60000 };
const REP_CATS = ["pay", "abuse", "sexual", "assault", "accident", "other"];
const REP_WINS = [[30, "kvW30"], [60, "kvW60"], [120, "kvW120"], ["pick", "kvWPick"]];
const SHIELD = (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.6-3.4 8.3-8 9-4.6-.7-8-4.4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>`;
const ICON = {
  mic: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  cam: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>',
  pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

/* phone storage: "meta" (small records) + "blobs" (sealed files), same key */
const kvDB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("galla-kavach", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("meta", { keyPath: "id" }); r.result.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function run(stores, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(stores, mode); let out;
      const r = fn(tx); if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error);
    });
  }
  return {
    add: (m, blob) => run(["meta", "blobs"], "readwrite", tx => { tx.objectStore("meta").put(m); tx.objectStore("blobs").put(blob, m.id); }),
    metas: () => run(["meta"], "readonly", tx => tx.objectStore("meta").getAll()),
    blob: id => run(["blobs"], "readonly", tx => tx.objectStore("blobs").get(id)),
    del: id => run(["meta", "blobs"], "readwrite", tx => { tx.objectStore("meta").delete(id); tx.objectStore("blobs").delete(id); }),
    /** Marks phone-only video inside [from, to] for upload. */
    queueWindow: async (from, to) => {
      let n = 0;
      await run(["meta"], "readwrite", tx => {
        const c = tx.objectStore("meta").openCursor();
        c.onsuccess = () => {
          const cur = c.result; if (!cur) return;
          const m = cur.value;
          if (m.kind === "video" && m.state === "local" && m.end >= from && m.start <= to) { cur.update({ ...m, state: "queued" }); n++; }
          cur.continue();
        };
      });
      return n;
    }
  };
})();

/* sealing */
const b64 = buf => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); };
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
let kvPub = null;
async function kvKey() {
  if (kvPub) return kvPub;
  if (KAVACH_PUBLIC_KEY) return kvPub = await crypto.subtle.importKey("jwk", KAVACH_PUBLIC_KEY, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
  if (!DEMO) return null;
  // Demo: a throwaway key whose private half is never kept, so demo recordings can't be opened by anyone.
  const kp = await crypto.subtle.generateKey({ name: "RSA-OAEP", modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, false, ["encrypt", "decrypt"]);
  return kvPub = kp.publicKey;
}
/** File format "GKV1": 4-byte magic, 4-byte header length, JSON header (times, GPS, SHA-256 of the recording, iv, wrapped key), then ciphertext. */
async function seal(blob, head) {
  const raw = await blob.arrayBuffer();
  const hash = hex(await crypto.subtle.digest("SHA-256", raw));
  const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, raw);
  const wrapped = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, await kvKey(), await crypto.subtle.exportKey("raw", key));
  const header = new TextEncoder().encode(JSON.stringify({ v: 1, ...head, hash, size: raw.byteLength, iv: b64(iv), key: b64(wrapped) }));
  const pre = new Uint8Array(8); pre.set([0x47, 0x4B, 0x56, 0x31]); new DataView(pre.buffer).setUint32(4, header.length);
  return { hash, size: raw.byteLength, pkg: new Blob([pre, header, ct], { type: "application/octet-stream" }) };
}

/* report windows that must keep their video (from reports filed on this phone) */
const kvHolds = () => LS.get("gl_kv_holds", []).filter(h => h.to > Date.now() - KV.MAX_AGE_MS);
const kvCovered = (a, b) => kvHolds().some(h => b >= h.from && a <= h.to);
async function kvHold(from, to) { if (NATIVE) { NATIVE.hold(from, to); return 0; } LS.set("gl_kv_holds", [...kvHolds(), { from, to }]); const n = await kvDB.queueWindow(from, to); kvPump(); return n; }

const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? `${h}:${String(m).padStart(2, "0")}` : String(m)) + ":" + String(s % 60).padStart(2, "0"); };
const ymd = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

const kv = { on: false, busy: false, stream: null, recs: [], startedAt: 0, pos: null, watchId: null, wake: null, hiddenAt: 0, tick: null, metas: [], reports: [] };

/** Back-to-back recorders on one stream; each closes as a standalone, playable file every SEG_MS. */
function segRecorder(stream, kind, opts) {
  const o = { ...opts }; if (!o.mimeType) delete o.mimeType;
  const run = { stop: false, cur: null, t: null };
  const begin = () => {
    const r = new MediaRecorder(stream, o), parts = [], start = Date.now();
    r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    r.onstop = () => { if (parts.length) kvChunk(kind, start, Date.now(), new Blob(parts, { type: r.mimeType || o.mimeType || "" })); };
    r.start();
    run.cur = r;
    // Start the next file first, then close this one: no gap between minutes.
    run.t = setTimeout(() => { if (!run.stop) { begin(); r.stop(); } }, KV.SEG_MS);
  };
  begin();
  return { stop() { run.stop = true; clearTimeout(run.t); if (run.cur && run.cur.state !== "inactive") run.cur.stop(); } };
}

async function kvChunk(kind, start, end, blob) {
  try {
    const id = `${start}-${kind}-${Math.random().toString(36).slice(2, 6) || "x"}`;
    const p = kv.pos && Date.now() - kv.pos.t < 5 * 60000 ? kv.pos : null;
    const head = { id, cid, kind, start, end, mime: blob.type, lat: p ? p.lat : null, lng: p ? p.lng : null, acc: p ? p.acc : null };
    const s = await seal(blob, head);
    const state = kind === "audio" || kvCovered(start, end) ? "queued" : "local";
    await kvDB.add({ id, kind, start, end, hash: s.hash, size: s.pkg.size, state }, s.pkg);
    store.kvRegister({ id, kind, start, end, hash: s.hash, size: s.size, lat: head.lat, lng: head.lng }).catch(console.error);
    kvPump(); kvClean(); kvRefresh();
  } catch (e) { console.error("kavach chunk", e); }
}

/** Uploads queued files oldest-first; anything that fails stays queued for the next try. */
async function kvPump() {
  if (kvPump.busy || !navigator.onLine || !store) return;
  kvPump.busy = true;
  try {
    for (;;) {
      const q = (await kvDB.metas()).filter(m => m.state === "queued").sort((a, b) => a.start - b.start);
      if (!q.length) break;
      const m = q[0], blob = await kvDB.blob(m.id);
      if (blob) { await store.kvUpload(m.id, blob); kvStat(blob.size); }
      await kvDB.del(m.id);
      kvRefresh();
    }
  } catch (e) { console.warn("kavach upload paused", e); }
  kvPump.busy = false;
}

async function kvClean() {
  const now = Date.now();
  for (const m of await kvDB.metas()) {
    if (m.start < now - KV.MAX_AGE_MS || (m.kind === "video" && m.state === "local" && m.end < now - KV.VIDEO_KEEP_MS)) await kvDB.del(m.id);
  }
}
async function kvRefresh() { try { kv.metas = await kvDB.metas(); } catch { kv.metas = []; } kvRender(); }

async function kvWake() { try { if ("wakeLock" in navigator && !document.hidden) kv.wake = await navigator.wakeLock.request("screen"); } catch {} }

function kvNativePoll() {
  let st; try { st = JSON.parse(NATIVE.status()); } catch { return; }
  const changed = st.on !== kv.on;
  kv.on = !!st.on; kv.startedAt = st.startedAt || 0; kv.native = st;
  if (changed || current === "scrKavach") kvRender(); else kvLinkRender();
}
async function kvStart() {
  if (kv.on || kv.busy) return kv.on;
  if (NATIVE) {
    if (!DEMO && !KAVACH_PUBLIC_KEY) { toast(t("kvNotSetup")); return false; }
    const r = String(NATIVE.start(JSON.stringify(kvNativeConfig())));   // native asks for any missing permission itself
    if (r.startsWith("error")) { toast(t("kvPerm")); return false; }
    setTimeout(kvNativePoll, 700); setTimeout(kvNativePoll, 2500);
    return true;
  }
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !(window.crypto && crypto.subtle) || !window.indexedDB) { toast(t(window.top !== window.self ? "kvEmbedded" : "kvNoSupport")); return false; }
  kv.busy = true; kvRender();
  try {
    if (!(await kvKey())) { toast(t("kvNotSetup")); return false; }
    // Inside another site's frame without camera/mic rights (e.g. a preview), say so instead of blaming the captain's settings.
    const pol = document.permissionsPolicy || document.featurePolicy;
    if (pol && pol.allowsFeature && !pol.allowsFeature("microphone")) { toast(t("kvEmbedded")); return false; }
    const audio = { echoCancellation: false, noiseSuppression: true, autoGainControl: true };
    let stream = null, camFail = false;
    if (kvVideoOn()) {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio, video: { facingMode: kvFacing() === "back" ? "environment" : "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15, max: 20 } } }); }
      catch (e) { camFail = true; }
    }
    if (!stream) {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
      catch (e) { toast(t(window.top !== window.self && e && e.name === "NotAllowedError" ? "kvEmbedded" : "kvPerm")); return false; }
    }
    if (camFail) toast(t("kvCamFail"));
    kv.stream = stream;
    const aMime = pickMime(["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"]);
    const vMime = pickMime(["video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]);
    kv.recs = [segRecorder(new MediaStream(stream.getAudioTracks()), "audio", { mimeType: aMime, audioBitsPerSecond: KV.AUDIO_BPS })];
    if (stream.getVideoTracks().length) kv.recs.push(segRecorder(stream, "video", { mimeType: vMime, videoBitsPerSecond: KV.VIDEO_BPS, audioBitsPerSecond: KV.AUDIO_BPS }));
    stream.getTracks().forEach(tr => tr.addEventListener("ended", () => { if (kv.on && kv.stream === stream && !document.hidden) kvRestart(); }));
    kv.on = true; kv.startedAt = Date.now(); LS.set("gl_kv_on", true);
    if (stream.getVideoTracks().length) { const pv = $("kvPreview"); pv.srcObject = stream; pv.style.transform = kvFacing() === "back" ? "none" : "scaleX(-1)"; pv.play().catch(() => {}); }
    if (navigator.geolocation) kv.watchId = navigator.geolocation.watchPosition(
      p => { kv.pos = { lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy), t: Date.now() }; },
      () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
    kvWake();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    clearInterval(kv.tick); kv.tick = setInterval(kvTickUI, 1000);
    return true;
  } finally { kv.busy = false; kvRender(); }
}

function kvStop(restarting = false) {
  if (NATIVE) { NATIVE.stop(); setTimeout(kvNativePoll, 700); return; }
  if (!kv.on) return;
  kv.recs.forEach(r => r.stop()); kv.recs = [];
  const s = kv.stream; kv.stream = null;
  setTimeout(() => s && s.getTracks().forEach(tr => tr.stop()), 400);   // let the last files close first
  if (kv.watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(kv.watchId);
  kv.watchId = null;
  if (kv.wake) { kv.wake.release().catch(() => {}); kv.wake = null; }
  clearInterval(kv.tick); kv.on = false;
  if (!restarting) LS.set("gl_kv_on", false);
  $("kvPreview").srcObject = null;
  kvRender();
}
async function kvRestart() {
  if (NATIVE) { NATIVE.stop(); await new Promise(r => setTimeout(r, 1200)); kv.on = false; await kvStart(); return; }
  kvStop(true); await new Promise(r => setTimeout(r, 600)); await kvStart();
}

document.addEventListener("visibilitychange", () => {
  if (!kv.on) return;
  if (document.hidden) { kv.hiddenAt = Date.now(); return; }
  const away = kv.hiddenAt ? Date.now() - kv.hiddenAt : 0; kv.hiddenAt = 0;
  kvWake();
  if (away > 5000) toast(fill(t("kvPaused"), { d: dur(away) }));
  if (kv.stream && kv.stream.getTracks().some(tr => tr.readyState === "ended")) kvRestart();
});

$("repSend").onclick = async () => {
  if (!rep.cat) { $("repErr").textContent = t("kvRepNeed"); return; }
  const now = Date.now(); let from, to;
  if (rep.win === "pick") {
    const v = $("repTime").value;

  } else { from = now - rep.win * 60000; to = now; }
  $("repSend").disabled = true;
  try {
    await kvFile(rep.cat, from, to, $("repNote").value.trim().slice(0, 500));
    closeSheets();
    $("doneExpH").textContent = t("kvRepDone"); $("doneExpP").textContent = t("kvRepDoneP");

/* SOS */
function kvLocate() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), t: Date.now() }), () => res(null), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}
function kvSmsLink(p, searching = false) {
  const nums = kvContacts(), a = $("sosSms");
  $("sosLoc").textContent = p ? `${p.lat}, ${p.lng}` : t(searching ? "kvSosLoc" : "kvGpsNo");
  if (!nums.length) { a.href = "#"; a.onclick = e => { e.preventDefault(); openContacts(true); }; return; }
  a.onclick = null;
  const u = p ? `https://maps.google.com/?q=${p.lat},${p.lng}` : "—";
  a.href = `sms:${nums.join(",")}?body=${encodeURIComponent(fill(t("kvSosMsg"), { u, c: cid }))}`;
}
$("kvSosBtn").onclick = async () => {
  kvSmsLink(kv.pos, true); $("sosNote").classList.add("hidden");
  openSheet("sheetSos");
  const ok = kv.on || await kvStart();   // an emergency skips the intro sheet
  const now = Date.now();
  kvFile("sos", now - KV.SOS_MS, now + KV.SOS_MS, "").catch(console.error);
  $("sosNote").classList.toggle("hidden", !ok);

/* ---------- automatic earnings: test mode (Android app) ---------- */
function autoLog() { try { return JSON.parse(NATIVE.notifLog()) || []; } catch { return []; } }
/** Stretches of time each ride app kept a permanent ("ongoing") notification up — usually while online. */
function autoSessions(log) {
  const byKey = {}, out = [];
  log.forEach(e => {
    if (!e.ongoing && e.ev !== "removed") return;
    const k = e.key || e.pkg, cur = byKey[k];
    if (e.ev === "removed") { if (cur) { cur.end = e.t; out.push(cur); delete byKey[k]; } return; }
    if (!cur) byKey[k] = { app: e.app || e.pkg, start: e.t, end: null, title: e.title };
  });
  Object.values(byKey).forEach(x => out.push(x));
  return out.filter(x => (x.end || Date.now()) - x.start >= 60000).sort((a, b) => b.start - a.start);
}
function renderAuto() {
  const on = !!NATIVE.notifAccess(), log = autoLog();
  $("autoOff").classList.toggle("hidden", on); $("autoAllow").classList.toggle("hidden", on);
  const when = ts => (ts < dayStart() ? new Date(ts).toLocaleDateString(locale(), { day: "numeric", month: "short" }) + " " : "") + hhmm(ts);
  const ss = $("autoSessions"); ss.innerHTML = "";
  const sess = autoSessions(log);
  if (!sess.length) { const li = el("li"); li.appendChild(el("span", "muted", t("autoNone"))); ss.appendChild(li); }
  sess.slice(0, 20).forEach(x => {
    const li = el("li"), mid = el("div", "li-m");
    li.appendChild(el("div", "li-t", when(x.start)));
    mid.append(el("b", "", x.app), el("span", "", `${hhmm(x.start)}–${x.end ? hhmm(x.end) : t("autoNow")} · ${x.title || ""}`));
    li.append(mid, el("div", "li-a", dur((x.end || Date.now()) - x.start))); ss.appendChild(li);
  });
  const ul = $("autoList"); ul.innerHTML = "";
  $("autoCount").textContent = log.length ? String(log.length) : "";
  if (!log.length) { const li = el("li"); li.appendChild(el("span", "muted", t("autoNone"))); ul.appendChild(li); }
  log.slice(-120).reverse().forEach(e => {
    const li = el("li"), mid = el("div", "li-m"), nm = el("b", "", e.app || e.pkg);
    if (e.ongoing) nm.appendChild(el("span", "tag", "ongoing"));
    if (e.ev === "removed") nm.appendChild(el("span", "tag", "removed"));
    mid.append(nm, el("span", "", [e.title, e.text || e.big].filter(Boolean).join(" — ")));
    li.append(el("div", "li-t", when(e.t)), mid); ul.appendChild(li);
  });
}
function openAuto() { renderAuto(); openSheet("sheetAuto"); }
$("autoAllow").onclick = () => NATIVE.notifSettings();
$("autoClear").onclick = () => { if (confirm(t("autoClear") + "?")) { NATIVE.notifClear(); renderAuto(); toast(t("autoCleared")); } };
$("autoShare").onclick = () => {
  const d = ts => new Date(ts).toLocaleString("en-IN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  const lines = autoLog().slice(-300).map(e => [d(e.t), e.app, e.pkg, e.ev, e.ongoing ? "ongoing" : "", e.cat, e.title, e.text, e.big !== e.text ? e.big : ""].join(" | "));
  NATIVE.shareText(`Galla notification test · ${cid} · Android app ${NATIVE.version ? NATIVE.version() : ""}\n` + lines.join("\n"));
};
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !NATIVE || !NATIVE.notifAccess) return;
  if ($("sheetAuto").classList.contains("open")) renderAuto();
  if (current === "scrSettings") renderSettings();
});
function openSettings() { $("stErr").textContent = ""; show("scrSettings"); renderSettings(); }
$("goSettings").onclick = openSettings;
$("editSetup").onclick = openSettings;
$("setBack").onclick = () => { show("scrMain"); render._lastNet = null; shownNet = 0; render(); };

/* ---------- language, network, day change ---------- */
$("langSel").onchange = e => { lang = e.target.value; LS.set("gl_lang", lang); applyLang(); };
window.addEventListener("online", renderBanners); window.addEventListener("offline", renderBanners);
const todayKey = new Date().toDateString();
// New day: reload for fresh totals, but never while Kavach is recording.
document.addEventListener("visibilitychange", () => { if (!document.hidden && !kv.on && new Date().toDateString() !== todayKey) location.reload(); });
window.addEventListener("online", () => kvPump());
setInterval(() => { kvPump(); }, 30000);
setInterval(() => { kvClean().then(kvRefresh).catch(() => {}); }, 5 * 60000);
setInterval(() => { if (current === "scrMain") render(); }, 30000);

/* ---------- Android app hooks ---------- */
// The Android back button: close a sheet, else go back to the home screen; false lets the app close.
window.gallaBack = () => {
  if (document.querySelector(".sheet.open")) { closeSheets(); return true; }
  if (["scrWeek", "scrKavach", "scrSettings"].includes(current)) { show("scrMain"); render._lastNet = null; shownNet = 0; render(); return true; }
  return false;
};
// "SOS" on the recording notification opens this.
/** Tells the Android app where to draw its live camera preview (the #kvCam frame), or to hide it. */
let kvPreviewLast = "";
function kvPreviewSync(force) {
  if (!NATIVE || !NATIVE.preview) return;
  const cam = $("kvCam");
  let msg = { show: false };
  if (current === "scrKavach" && !cam.classList.contains("hidden") && !document.querySelector(".sheet.open, .done.open")) {
    const r = cam.getBoundingClientRect(), b = 2;   // inside the 2px border
    if (r.bottom > 0 && r.top < innerHeight) msg = { show: true, x: Math.round(r.left + b), y: Math.round(r.top + b), w: Math.round(r.width - 2 * b), h: Math.round(r.height - 2 * b), facing: kvFacing(), rec: kv.on };
  }
  const key = JSON.stringify(msg);
  if (force || key !== kvPreviewLast) { kvPreviewLast = key; NATIVE.preview(key); }
}
window.gallaPreviewSync = () => kvPreviewSync(true);
addEventListener("scroll", () => requestAnimationFrame(() => kvPreviewSync()), { passive: true });
addEventListener("resize", () => kvPreviewSync());
// "Share → Galla" from the gallery or the screenshot toast: images arrive already shrunk, as data URLs.
window.gallaImportShared = async urls => {
  for (let i = 0; i < 50 && !(store && state.cap && state.cap.profile); i++) await new Promise(r => setTimeout(r, 300));
  if (!(store && state.cap && state.cap.profile)) return;
  const files = await Promise.all(urls.map(async (u, i) => new File([await (await fetch(u)).blob()], `shared-${i}.jpg`, { type: "image/jpeg" })));
  if (current !== "scrMain") show("scrMain");
  closeSheets(); resetImp(); $("impErr").textContent = ""; impStep("impPick"); openSheet("sheetImp");
  readFiles(files);
};
window.gallaNativeSOS = () => { show("scrKavach"); kvRefresh(); $("kvSosBtn").click(); };
if (NATIVE) {
  setInterval(kvNativePoll, 2000);
  // Hand the recorder a fresh sign-in now and then, so its uploads count as this captain's.
  const pushAuth = () => { if (!DEMO && store && store.authInfo && NATIVE.setAuth) { const a = store.authInfo(); if (a.refreshToken) NATIVE.setAuth(JSON.stringify(a)); } };
  setTimeout(pushAuth, 4000); setInterval(pushAuth, 30 * 60000);
}

/* ---------- offline app shell ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- boot ---------- */
(async function boot() {
  applyLang();
  const param = new URLSearchParams(location.search).get("c");
  cid = (param || LS.get("gl_cid") || (DEMO ? "DEMO1234" : "")).trim();
  if (!/^[A-Za-z0-9]{6,20}$/.test(cid)) { message(t("noCode")); return; }
  LS.set("gl_cid", cid);
  $("codeLabel").textContent = `${t("yourCode")}: ${cid}`;
  store = DEMO ? new LocalStore(cid) : new FireStore(cid);
  let res;
  try { res = await store.init(); } catch (e) { console.error(e); res = navigator.onLine ? "error" : "needNet"; }
  if (res === "needNet") { message(t("firstNet")); return; }
  if (res === "claimed") { message(t("claimed") + (SUPPORT_PHONE ? " " + SUPPORT_PHONE : "")); return; }
  if (res !== "ok") { message(t("errSave")); return; }
  let first = true;
  store.subscribe(s => {
    state = s;
    if (first) {
      first = false;
      const p = state.cap.profile;
      if (p && p.lang && !LS.get("gl_lang")) { lang = p.lang; applyLang(); }
      store.watchReports(r => { kv.reports = r; kvRender(); });
      kvClean().then(kvRefresh).then(kvPump).catch(console.error);
      if (!p) { setupDraft = { vehicle: null, apps: [] }; show("scrSetup"); renderSetup(); return; }
      show("scrMain");
      // Was recording when the page closed or reloaded: pick up again (works once camera/mic permission is granted).
      // In the Android app the recorder is a separate service that keeps running by itself.
      if (!NATIVE && LS.get("gl_kv_on") && kvConsented()) kvStart();
    }
    render();
  });
})();
</script>
</body>
