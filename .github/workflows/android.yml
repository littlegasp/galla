# Builds the Galla Android app on every change under android/ and publishes it as
# https://github.com/littlegasp/galla/releases/latest/download/galla.apk
# The result of each build is also written to the "ci-status" branch (status.txt + build.log).
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Use the private signing key if it has been added as secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.GALLA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/galla-release.jks"
            echo "GALLA_KEYSTORE=$RUNNER_TEMP/galla-release.jks" >> "$GITHUB_ENV"
            echo "Using the private release key"
          else
            echo "Using the pilot key in android/keystore"
          fi

      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: android
        env:
          GALLA_KEYSTORE_PASSWORD: ${{ secrets.GALLA_KEYSTORE_PASSWORD }}
          GALLA_KEY_ALIAS: ${{ secrets.GALLA_KEY_ALIAS }}
          GALLA_KEY_PASSWORD: ${{ secrets.GALLA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Empty secrets must not override the pilot defaults
          [ -z "$GALLA_KEYSTORE_PASSWORD" ] && unset GALLA_KEYSTORE_PASSWORD
          [ -z "$GALLA_KEY_ALIAS" ] && unset GALLA_KEY_ALIAS
          [ -z "$GALLA_KEY_PASSWORD" ] && unset GALLA_KEY_PASSWORD
          gradle assembleRelease --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish the APK
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk galla.apk
          sha256sum galla.apk | tee galla.apk.sha256
          gh release create "android-${{ github.run_number }}" galla.apk galla.apk.sha256 \
            --title "Galla Android 0.1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install: download galla.apk on the phone and open it." \
            --latest

      - name: Write build status to the ci-status branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/status" && cd "$RUNNER_TEMP/status"
          {
            echo "outcome: ${{ steps.build.outcome }}"
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "time: $(date -u +%FT%TZ)"
            echo
            echo "--- errors ---"
            grep -E "^e: |error:|What went wrong|FAILURE|Could not" "$GITHUB_WORKSPACE/build.log" | head -80 || true
          } > status.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > build.log || true
          git init -q && git checkout -q -b ci-status
          git -c user.name="galla-ci" -c user.email="galla-ci@users.noreply.github.com" add -A
          git -c user.name="galla-ci" -c user.email="galla-ci@users.noreply.github.com" commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
