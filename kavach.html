<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Galla Kavach — Ride recording notice</title>
<meta name="description" content="This ride is recorded for safety by Galla Kavach. What is recorded, who can see it, and when it is deleted.">
<link rel="icon" type="image/png" href="assets/icon-96.png">
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@700;800&family=Anek+Gujarati:wght@800&family=Hind:wght@400;600&family=Hind+Vadodara:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --y: #FFC629; --ink: #121212; --cream: #F6F2E7; --line: #E4DDCB; --muted: #5A5547; --rec: #E53935;
          --fd: 'Anek Devanagari', 'Anek Gujarati', sans-serif; --fb: 'Hind', 'Hind Vadodara', system-ui, sans-serif; }
  html[lang="gu"] { --fd: 'Anek Gujarati', 'Anek Devanagari', sans-serif; --fb: 'Hind Vadodara', 'Hind', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--fb); font-size: 17px; line-height: 1.5; }
  .app { max-width: 560px; margin: 0 auto; }
  .band { background: var(--ink); color: #fff; padding: 18px 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; }
  .brand b { font-family: var(--fd); font-weight: 800; font-size: 26px; color: var(--y); line-height: 1; }
  .brand span { display: block; font-size: 13px; color: #D9D3C3; }
  h1 { font-family: var(--fd); font-weight: 800; font-size: 28px; line-height: 1.2; margin: 16px 0 6px; }
  h1 i { font-style: normal; color: var(--y); }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .langs button { font: inherit; font-size: 15px; font-weight: 600; height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid var(--y); background: transparent; color: var(--y); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--y); color: var(--ink); }
  .road { height: 10px; margin: 18px -16px 0; background-image: repeating-linear-gradient(90deg, var(--y) 0 24px, var(--ink) 24px 48px); }
  main { padding: 6px 16px 40px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 12px; }
  .card h2 { font-family: var(--fd); font-weight: 800; font-size: 20px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .card p { margin: 0; }
  .lock { border-left: 6px solid var(--y); }
  .fine { font-size: 13px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="app">
  <div class="band">
    <div class="brand"><img src="assets/icon-96.png" alt=""><div><b>Galla Kavach</b><span data-t="sub"></span></div></div>
    <h1 data-t="h1"></h1>
    <div class="langs" id="langs"></div>
    <div class="road"></div>
  </div>
  <main>
    <div class="card"><h2 data-t="whatT"></h2><p data-t="what"></p></div>
    <div class="card"><h2 data-t="whyT"></h2><p data-t="why"></p></div>
    <div class="card lock"><h2 data-t="whoT"></h2><p data-t="who"></p></div>
    <div class="card"><h2 data-t="delT"></h2><p data-t="del"></p></div>
    <div class="card"><h2 data-t="youT"></h2><p data-t="you"></p></div>
    <div class="card"><h2 data-t="contactT"></h2><p id="contact"></p></div>
    <p class="fine" data-t="fine"></p>
  </main>
</div>
<script>
/* Who is responsible for these recordings, and how riders reach them. Fill in before stickers go on vehicles. */
const CONTACT = { name: "Galla, Mumbai", phone: "", email: "" };

const T = {
  sub:   { hi: "राइड सुरक्षा रिकॉर्डर", mr: "राईड सुरक्षा रेकॉर्डर", gu: "રાઇડ સુરક્ષા રેકોર્ડર", en: "Ride safety recorder" },
  h1:    { hi: "यह राइड <i>आपकी और कैप्टन की सुरक्षा</i> के लिए रिकॉर्ड होती है", mr: "ही राईड <i>तुमच्या आणि कॅप्टनच्या सुरक्षेसाठी</i> रेकॉर्ड होते", gu: "આ રાઇડ <i>તમારી અને કૅપ્ટનની સુરક્ષા</i> માટે રેકોર્ડ થાય છે", en: "This ride is recorded <i>for your safety and the captain's</i>" },
  whatT: { hi: "क्या रिकॉर्ड होता है", mr: "काय रेकॉर्ड होते", gu: "શું રેકોર્ડ થાય છે", en: "What is recorded" },
  what:  { hi: "राइड के दौरान आवाज़, और कैप्टन के फ़ोन के सामने वाले कैमरे का वीडियो — समय और लोकेशन के साथ।", mr: "राईड दरम्यान आवाज, आणि कॅप्टनच्या फोनच्या समोरच्या कॅमेऱ्याचा व्हिडिओ — वेळ आणि लोकेशनसह.", gu: "રાઇડ દરમિયાન અવાજ, અને કૅપ્ટનના ફોનના આગળના કૅમેરાનો વીડિયો — સમય અને લોકેશન સાથે.", en: "Audio during the ride, and video from the front camera of the captain's phone — with time and location." },
  whyT:  { hi: "क्यों", mr: "का", gu: "શા માટે", en: "Why" },
  why:   { hi: "अगर कोई विवाद, बदसलूकी, छेड़छाड़ या एक्सीडेंट हो, तो सच्चाई का सबूत रहे — सवारी और कैप्टन दोनों के लिए।", mr: "वाद, गैरवर्तन, छेडछाड किंवा अपघात झाल्यास सत्याचा पुरावा राहावा — प्रवासी आणि कॅप्टन दोघांसाठी.", gu: "કોઈ વિવાદ, ગેરવર્તન, છેડતી કે અકસ્માત થાય તો સાચો પુરાવો રહે — સવારી અને કૅપ્ટન બંને માટે.", en: "So there is honest proof if there is a dispute, misbehaviour, harassment or an accident — for the rider and the captain alike." },
  whoT:  { hi: "कौन देख सकता है", mr: "कोण पाहू शकते", gu: "કોણ જોઈ શકે", en: "Who can see it" },
  who:   { hi: "कोई नहीं — कैप्टन भी नहीं। रिकॉर्डिंग फ़ोन पर ही लॉक (एन्क्रिप्ट) हो जाती है। सेफ़्टी रिपोर्ट होने पर ही, जाँच के बाद, सिर्फ़ पुलिस (लिखित माँग पर) या संबंधित व्यक्ति के वकील को दी जाती है। कभी सोशल मीडिया पर नहीं।", mr: "कोणीही नाही — कॅप्टनसुद्धा नाही. रेकॉर्डिंग फोनवरच लॉक (एन्क्रिप्ट) होते. सेफ्टी रिपोर्ट झाल्यावरच, तपासणीनंतर, फक्त पोलिसांना (लेखी मागणीवर) किंवा संबंधित व्यक्तीच्या वकिलांना दिली जाते. कधीही सोशल मीडियावर नाही.", gu: "કોઈ નહીં — કૅપ્ટન પણ નહીં. રેકોર્ડિંગ ફોન પર જ લૉક (એન્ક્રિપ્ટ) થાય છે. સેફ્ટી રિપોર્ટ થાય ત્યારે જ, તપાસ પછી, ફક્ત પોલીસને (લેખિત માંગ પર) અથવા સંબંધિત વ્યક્તિના વકીલને અપાય છે. ક્યારેય સોશિયલ મીડિયા પર નહીં.", en: "Nobody — not even the captain. The recording is locked (encrypted) on the phone itself. Only after a safety report, and a review, is it given to the police (on written request) or to the lawyer of the person concerned. Never on social media." },
  delT:  { hi: "कब डिलीट होती है", mr: "कधी डिलीट होते", gu: "ક્યારે ડિલીટ થાય છે", en: "When it is deleted" },
  del:   { hi: "7 दिन बाद अपने-आप, जब तक उस राइड पर सेफ़्टी रिपोर्ट न हो। फ़ोन पर रखा वीडियो 2 घंटे में मिट जाता है।", mr: "7 दिवसांनी आपोआप, जोपर्यंत त्या राईडवर सेफ्टी रिपोर्ट नाही. फोनवरचा व्हिडिओ 2 तासांत पुसला जातो.", gu: "7 દિવસ પછી આપમેળે, જ્યાં સુધી એ રાઇડ પર સેફ્ટી રિપોર્ટ ન હોય. ફોન પરનો વીડિયો 2 કલાકમાં ભૂંસાઈ જાય છે.", en: "Automatically after 7 days, unless a safety report covers that ride. Video kept on the phone is erased within 2 hours." },
  youT:  { hi: "आपके लिए", mr: "तुमच्यासाठी", gu: "તમારા માટે", en: "For you" },
  you:   { hi: "अगर इस राइड में आपके साथ कुछ गलत हुआ, तो 7 दिन के अंदर नीचे दिए नंबर पर बताएं — हम उस समय की रिकॉर्डिंग सुरक्षित रख लेंगे। कोई सवाल या आपत्ति हो, तो भी संपर्क करें।", mr: "या राईडमध्ये तुमच्यासोबत काही चुकीचे झाले असेल तर 7 दिवसांच्या आत खालील नंबरवर कळवा — आम्ही त्या वेळेचे रेकॉर्डिंग सुरक्षित ठेवू. काही प्रश्न किंवा आक्षेप असल्यासही संपर्क करा.", gu: "આ રાઇડમાં તમારી સાથે કંઈ ખોટું થયું હોય તો 7 દિવસની અંદર નીચેના નંબર પર જણાવો — અમે એ સમયનું રેકોર્ડિંગ સુરક્ષિત રાખીશું. કોઈ પ્રશ્ન કે વાંધો હોય તો પણ સંપર્ક કરો.", en: "If something wrong happened to you on this ride, tell us within 7 days at the contact below — we will keep that time's recording safe. Contact us too with any question or objection." },
  contactT: { hi: "संपर्क", mr: "संपर्क", gu: "સંપર્ક", en: "Contact" },
  soon:  { hi: "संपर्क नंबर जल्द जोड़ा जाएगा।", mr: "संपर्क नंबर लवकरच जोडला जाईल.", gu: "સંપર્ક નંબર જલ્દી ઉમેરાશે.", en: "Contact number coming soon." },
  fine:  { hi: "रिकॉर्डिंग के लिए ज़िम्मेदार: ", mr: "रेकॉर्डिंगसाठी जबाबदार: ", gu: "રેકોર્ડિંગ માટે જવાબદાર: ", en: "Responsible for these recordings: " }
};
const LANGS = [["hi", "हिंदी"], ["mr", "मराठी"], ["gu", "ગુજરાતી"], ["en", "English"]];
let lang = (() => { try { return localStorage.getItem("gl_lang") || "hi"; } catch { return "hi"; } })();
if (!T.sub[lang]) lang = "hi";

function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => {
    const v = T[e.dataset.t][lang];
    if (e.dataset.t === "h1") e.innerHTML = v; else e.textContent = v;   // h1 strings are fixed markup from this file
  });
  document.querySelector('[data-t="fine"]').textContent = T.fine[lang] + CONTACT.name;
  const c = document.getElementById("contact"); c.textContent = "";
  const parts = [];
  if (CONTACT.phone) { const a = document.createElement("a"); a.href = "tel:" + CONTACT.phone.replace(/\s/g, ""); a.textContent = CONTACT.phone; parts.push(a); }
  if (CONTACT.email) { const a = document.createElement("a"); a.href = "mailto:" + CONTACT.email; a.textContent = CONTACT.email; parts.push(a); }
  if (!parts.length) c.textContent = T.soon[lang];
  parts.forEach((a, i) => { if (i) c.append(" · "); c.append(a); });
  const box = document.getElementById("langs"); box.textContent = "";
  LANGS.forEach(([k, n]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.setAttribute("aria-pressed", k === lang ? "true" : "false");
    b.onclick = () => { lang = k; try { localStorage.setItem("gl_lang", k); } catch {} apply(); };
    box.appendChild(b);
  });
}
apply();
</script>
</body>
</html>
